name: Verify release tooling (no publication)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        module: [carddetector, tfmodel]
    env:
      RELEASE_MODULE: ${{ matrix.module }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release policy and deterministic documentation
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/module_release.py verify
          bash -n scripts/finalize-release.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Gradle build and local publication without credentials
        run: |
          ./gradlew generateImportDocs verifyImportDocs :carddetector:testDebugUnitTest :carddetector:lintRelease :carddetector:assembleRelease :tfmodel:assembleRelease :app:assembleDebug :carddetector:assembleDebugAndroidTest :app:assembleDebugAndroidTest :app:lintDebug ":$RELEASE_MODULE:publishAllPublicationsToVerificationRepository" "-PreleaseModule=$RELEASE_MODULE" -PreleaseVersion=9.8.7 --no-daemon
          git diff --exit-code -- IMPORT.md docs/releases/
          python3 scripts/module_release.py check-local --module "$RELEASE_MODULE" --version 9.8.7 --source "$(git rev-parse HEAD)"
      - name: Validate self-hosted Gradle task graph without uploading
        env:
          RELEASE_REPOSITORY: apexfission-maven
          MAVEN_REPOSITORY_URL: https://maven.example.invalid/releases
          MAVEN_REPOSITORY_USERNAME: verification-only
          MAVEN_REPOSITORY_PASSWORD: verification-only
        run: |
          ./gradlew ":$RELEASE_MODULE:publishAllPublicationsToApexfissionRepository" "-PreleaseModule=$RELEASE_MODULE" -PreleaseVersion=9.8.7 --dry-run --no-daemon
      - name: Upload demo APK
        uses: actions/upload-artifact@v4
        with:
          name: card-detection-demo-${{ matrix.module }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
