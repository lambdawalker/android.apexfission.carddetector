name: Verify Card Detector

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and lint the library
        run: ./gradlew :app:assembleRelease :app:lintDebug  --no-daemon
      - name: Render candidates or validate approved screenshots
        shell: bash
        run: |
          set -euo pipefail
          reference=app/src/screenshotTestDebug/reference
          task=:app:validateDebugScreenshotTest
          if ! git ls-files -- "$reference" | awk '/\.png$/ { found = 1 } END { exit !found }'; then
            task=:app:updateDebugScreenshotTest
          fi
          ./gradlew "$task" --no-daemon
          mkdir -p screenshot-manifest
          git rev-parse HEAD > screenshot-manifest/source.txt
          : > screenshot-manifest/images.sha256
          if [[ -d "$reference" ]]; then
            find "$reference" -name '*.png' -type f -print0 | sort -z |
              xargs -0 -r sha256sum > screenshot-manifest/images.sha256
          fi
          test -f screenshot-manifest/images.sha256
      - name: Upload screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-screenshot-results
          path: |
            screenshot-manifest/
            app/src/screenshotTestDebug/reference/
            app/build/reports/screenshotTest/
            app/build/outputs/screenshotTest-results/
