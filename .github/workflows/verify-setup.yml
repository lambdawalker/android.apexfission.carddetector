name: Verify repository setup
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v5
      - name: Install pinned CLI and legacy recovery test dependencies
        run: |
          cargo install --locked --git https://github.com/lambdawalker/gradle.android-repo-setup.git --tag v0.1.12 android-repo-setup
          python3 -m pip install -r scripts/requirements-setup.txt
      - name: Check generated setup and confirmed metadata
        run: |
          android-repo-setup workflows --check
          android-repo-setup publishing_config check
          android-repo-setup module_release verify
          android-repo-setup documentation_history verify
      - name: Compare evaluated Gradle inventory with configured modules
        run: |
          android-repo-setup discover > "$RUNNER_TEMP/modules.json"
          python3 - "$RUNNER_TEMP/modules.json" <<'PY'
          import json, sys, yaml
          from pathlib import Path
          actual = json.loads(Path(sys.argv[1]).read_text())
          expected = yaml.safe_load(Path('.project/setup/config.yaml').read_text())['android_modules']
          assert set(actual) == set(expected), (set(actual), set(expected))
          for module, configured in expected.items():
              for field in ('path', 'directory', 'kind', 'screenshots'):
                  assert actual[module][field] == configured[field], (module, field)
              if configured['kind'] == 'application':
                  assert set(actual[module]['application_ids']) == set(configured['application_ids'])
          PY
      - name: Preserve legacy recovery coverage
        run: python3 -m unittest discover -s scripts/tests -v
