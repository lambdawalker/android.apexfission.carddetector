name: Verify project documentation helpers
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - run: sh ./docs.sh check
