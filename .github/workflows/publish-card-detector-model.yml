name: Publish card-detector-model

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional X.Y.Z. Blank: first release 0.1.0, otherwise next patch.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish-card-detection.yml
    secrets: inherit
    with:
      module: tfmodel
      version: ${{ inputs.version }}
