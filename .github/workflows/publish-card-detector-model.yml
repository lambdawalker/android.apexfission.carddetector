name: Publish card-detector-model

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Destination repository (uses its matching GitHub environment)'
        type: choice
        required: true
        default: maven-central
        # BEGIN GENERATED REPOSITORIES
        options: ["maven-central", "apexfission-maven", "jitpack"]
        # END GENERATED REPOSITORIES
      version:
        description: 'Optional X.Y.Z. Blank: reuse unchanged module version, otherwise next patch.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish-card-detection.yml
    secrets: inherit
    with:
      repository: ${{ inputs.repository }}
      module: tfmodel
      version: ${{ inputs.version }}
