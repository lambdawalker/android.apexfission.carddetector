name: Documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ['Finalize CardDetector release', 'Publish card-detector', 'Publish card-detector-model']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
          lfs: true
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r scripts/requirements-setup.txt
      - run: python3 scripts/publishing_config.py check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sites/package-lock.json
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: npm ci && npm run check
        working-directory: sites
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites/dist
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: false
      - id: current
        env:
          BUILT_SHA: ${{ needs.build.outputs.source }}
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" = "$BUILT_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Main advanced; skip stale build. A newer run or manual dispatch will deploy.'
          fi
      - uses: actions/deploy-pages@v4
        id: deployment
        if: steps.current.outputs.deploy == 'true'
