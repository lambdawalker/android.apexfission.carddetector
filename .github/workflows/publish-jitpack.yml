name: Build selected library on JitPack

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      module:
        required: true
        type: string
      version:
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    concurrency:
      group: maven-central-card-detection
      cancel-in-progress: false
    env:
      RELEASE_REPOSITORY: jitpack
      RELEASE_MODULE: ${{ inputs.module }}
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r scripts/requirements-publishing.txt
      - name: Configure release identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Resolve shared module version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python3 scripts/module_release.py prepare --module "$RELEASE_MODULE" --version "$REQUESTED_VERSION"
      - name: Check out original release source
        if: steps.release.outputs.skip != 'true'
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source }}
        run: git checkout --detach "$SOURCE_SHA"
      - uses: actions/setup-java@v4
        if: steps.release.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
        if: steps.release.outputs.skip != 'true'
        with:
          cache-disabled: true
      - name: Retrieve and verify selected model assets
        if: steps.release.outputs.skip != 'true' && inputs.module == 'tfmodel'
        run: |
          git lfs pull --include='tfmodel/src/main/assets/**/*.tflite' --exclude=''
          PYTHONPATH=scripts python3 -c 'from jitpack_build import verify_models; verify_models()'
      - name: Verify unsigned candidate
        if: steps.release.outputs.skip != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source }}
        run: |
          ./gradlew ":$RELEASE_MODULE:testDebugUnitTest" ":$RELEASE_MODULE:publishAllPublicationsToVerificationRepository" -PjitpackBuild=true "-PreleaseModule=$RELEASE_MODULE" "-PreleaseVersion=$RELEASE_VERSION" --no-daemon
          python3 scripts/module_release.py check-local --module "$RELEASE_MODULE" --version "$RELEASE_VERSION" --source "$SOURCE_SHA"
      - name: Reserve destination and canonical source tag atomically
        if: steps.release.outputs.skip != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source }}
        run: python3 scripts/module_release.py reserve --module "$RELEASE_MODULE" --version "$RELEASE_VERSION" --source "$SOURCE_SHA"
      - name: Trigger build and verify public artifacts and source
        if: steps.release.outputs.skip != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: python3 scripts/module_release.py confirm --module "$RELEASE_MODULE" --version "$RELEASE_VERSION" --timeout 1800
      - name: Generate latest available installation instructions
        if: steps.release.outputs.skip != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source }}
        run: python3 scripts/module_release.py finalize --module "$RELEASE_MODULE" --version "$RELEASE_VERSION" --source "$SOURCE_SHA"
      - name: Recovery guidance
        if: failure()
        run: |
          echo 'Keep the canonical tag and destination journal. Inspect the JitPack build log.'
          echo 'Finalize CardDetector release with repository=jitpack verifies the same source without allocating a new version.'
