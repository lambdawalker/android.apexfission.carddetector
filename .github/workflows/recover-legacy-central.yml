name: Recover published Central carddetector 0.1.10

# One-time migration recovery. Verifies existing artifacts; never uploads them.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: maven-central
    concurrency:
      group: android-repository-release
      cancel-in-progress: false
    env:
      RELEASE_REPOSITORY: maven-central
      RELEASE_MODULE: carddetector
      RELEASE_VERSION: 0.1.10
      SOURCE_SHA: b36e4fce5b7583cb1f8a4fb6fe8c0888727b9e2c
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          lfs: false
      - name: Install existing finalizer
        run: cargo install --locked --git https://github.com/lambdawalker/gradle.android-repo-setup.git --tag v0.1.17 android-repo-setup
      - name: Check reservation and completion state
        id: release
        run: >-
          android-repo-setup module_release prepare-finalization
          --module "$RELEASE_MODULE" --version "$RELEASE_VERSION" --source "$SOURCE_SHA"
      - name: Verify public artifacts with their original release tooling
        if: steps.release.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # This exact source predates .project/setup/config.yaml. Its original
          # verifier checks all five hashes, contents and signature presence.
          legacy="$RUNNER_TEMP/carddetector-legacy-verification"
          # Detector verification reads public AARs; unrelated model/media LFS
          # downloads are unnecessary in this historical source checkout.
          GIT_LFS_SKIP_SMUDGE=1 git worktree add --detach "$legacy" "$SOURCE_SHA"
          trap 'git worktree remove --force "$legacy"' EXIT
          python3 -m venv "$RUNNER_TEMP/carddetector-legacy-python"
          python="$RUNNER_TEMP/carddetector-legacy-python/bin/python"
          "$python" -m pip install --disable-pip-version-check PyYAML==6.0.3
          (
            cd "$legacy"
            "$python" scripts/module_release.py confirm --module "$RELEASE_MODULE" --version "$RELEASE_VERSION" --timeout 120
          )
          mkdir -p build
          cp "$legacy/build/confirmed-carddetector.json" build/confirmed-carddetector.json
      - name: Finalize verified records and release markers atomically
        if: steps.release.outputs.skip != 'true'
        run: >-
          android-repo-setup module_release finalize
          --module "$RELEASE_MODULE" --version "$RELEASE_VERSION" --source "$SOURCE_SHA"
      - name: Verify final release metadata
        run: |
          android-repo-setup module_release verify
          android-repo-setup module_release prepare-finalization --module "$RELEASE_MODULE" --version "$RELEASE_VERSION" --source "$SOURCE_SHA"
      - name: Explain next step
        run: |
          {
            echo '### Central 0.1.10 recovery complete'
            echo 'Existing public artifacts were verified; no package was uploaded.'
            echo 'Start a new Publish carddetector run and explicitly select its destination.'
            echo 'For JitPack, select jitpack; the separate legacy JitPack attempt is preserved.'
          } >> "$GITHUB_STEP_SUMMARY"
