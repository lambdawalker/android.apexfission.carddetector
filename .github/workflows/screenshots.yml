name: Render documentation screens
on:
  pull_request:
  push:
    branches: [main, previews]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: screenshots-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  guide-transitions:
    name: Capture guide and layout tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          lfs: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          script: ./gradlew :carddetector:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=com.apexfission.android.carddetector.ui --no-daemon
      - name: Require all guide and layout cases
        run: python3 scripts/screenshots/verify_capture_ui_tests.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: capture-guide-transition-results
          path: |
            carddetector/build/reports/androidTests/
            carddetector/build/outputs/androidTest-results/
